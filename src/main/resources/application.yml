server:
  port: 8088

spring:
  application:
    name: metro-ticket-reservation-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/metro_ticket_reservation_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:1s}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.metro.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.metro: debug

app:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:metro}
    ticket-search-ttl: ${REDIS_TICKET_SEARCH_TTL:PT15S}
    reference-data-ttl: ${REDIS_REFERENCE_DATA_TTL:PT10M}
  jwt:
    secret: ${JWT_SECRET:metro-ticket-reservation-system-development-secret-key-change-me}
    expiration: ${JWT_EXPIRATION:86400000}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    max-tool-rounds: ${DEEPSEEK_MAX_TOOL_ROUNDS:4}

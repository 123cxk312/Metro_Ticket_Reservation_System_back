server:
  port: 8088

spring:
  application:
    name: metro-ticket-reservation-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/metro_ticket_reservation_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.metro.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.metro: debug

app:
  jwt:
    secret: ${JWT_SECRET:metro-ticket-reservation-system-development-secret-key-change-me}
    expiration: ${JWT_EXPIRATION:86400000}
